name: Alerta PER diaria

on:
  schedule:
    # 08:00 hora de España (verano, UTC+2) → 06:00 UTC. En invierno sería "0 7 * * 1-5".
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}   # botón para lanzarlo a mano y probar

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python alerta_per.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
